services:

  postgres:
    image: postgres:17
    container_name: auth-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_ready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-api:
    build: .
    container_name: auth-api

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"

    env_file:
      - .env

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/
      DB_NAME: ${DB_NAME}

volumes:
  postgres_data: