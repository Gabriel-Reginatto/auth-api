spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

    show-sql: false
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:}
  issuer: ${JWT_ISSUER}